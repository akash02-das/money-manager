services:
  postgres:
    image: postgres:16-alpine
    container_name: money-manager-postgres
    restart: always
    environment:
      POSTGRES_USER: moneymanager
      POSTGRES_PASSWORD: manager_secret_pass
      POSTGRES_DB: moneymanager_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymanager -d moneymanager_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

